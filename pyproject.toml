[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-core"
version = "0.1.0"
description = "Local-first cognitive assistant Tobi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=46,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]
media = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "sounddevice>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["apps/core"]

[tool.pytest.ini_options]
pythonpath = ["apps/core"]
testpaths = ["tests"]
cache_dir = "runtime/cache/pytest"
addopts = "--basetemp=runtime/tmp/pytest"

[tool.ruff]
cache-dir = "runtime/cache/ruff"
line-length = 100

[tool.mypy]
files = ["apps/core"]
strict = true
cache_dir = "runtime/cache/mypy"
