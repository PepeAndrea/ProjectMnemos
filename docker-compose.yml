services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mnemos
      POSTGRES_USER: mnemos
      POSTGRES_PASSWORD: mnemos
    ports:
      - "5432:5432"
    volumes:
      - ./runtime/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemos -d mnemos"]
      interval: 5s
      timeout: 5s
      retries: 10
