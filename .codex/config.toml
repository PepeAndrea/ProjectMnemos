# Project-scoped Codex settings. Loaded only for trusted projects.
# This intentionally sets a Sol root and Luna defaults for spawned agents.
model = "gpt-6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
